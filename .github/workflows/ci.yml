name: CI

on:
  push:
    branches: [main, 'feat/**']
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: sentinel
          POSTGRES_USER: sentinel
          POSTGRES_PASSWORD: sentinel
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U sentinel -d sentinel"
          --health-interval=5s
          --health-timeout=3s
          --health-retries=10
    env:
      SENTINEL_DATABASE_URL: postgresql://sentinel:sentinel@127.0.0.1:5432/sentinel
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install
        run: python -m pip install -e '.[dev]'
      - name: Migrate database
        run: python -m sentinel.migrate
      - name: Lint
        run: ruff check .
      - name: Tests
        run: pytest
