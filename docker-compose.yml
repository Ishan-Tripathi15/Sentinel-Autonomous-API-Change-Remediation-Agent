services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: sentinel
      POSTGRES_USER: sentinel
      POSTGRES_PASSWORD: sentinel
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sentinel -d sentinel"]
      interval: 5s
      timeout: 3s
      retries: 10
    volumes:
      - sentinel-postgres-data:/var/lib/postgresql/data

  api:
    build: .
    ports:
      - "8000:8000"
    environment:
      SENTINEL_ENV: development
      SENTINEL_DATABASE_URL: postgresql://sentinel:sentinel@db:5432/sentinel
    depends_on:
      db:
        condition: service_healthy
    command: ["sh", "-c", "python -m sentinel.migrate && uvicorn sentinel.api:app --host 0.0.0.0 --port 8000"]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health')"]
      interval: 10s
      timeout: 3s
      retries: 5

volumes:
  sentinel-postgres-data:
